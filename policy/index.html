    <style>
      :root {
        --bg: #05010c;
        --bg-soft: #120325;
        --panel: rgba(255, 255, 255, 0.08);
        --panel-strong: rgba(255, 255, 255, 0.12);
        --border: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
        --text-soft: rgba(255, 255, 255, 0.8);
        --text-muted: #cbb7ff;
        --accent: #8e4cff;
        --accent-strong: #6d20ff;
        --shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
        --max-width: 1180px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        line-height: 1.6;
        background:
          radial-gradient(circle at top, rgba(123, 44, 255, 0.35), transparent 28%),
          radial-gradient(circle at right, rgba(64, 20, 120, 0.28), transparent 24%),
          linear-gradient(180deg, #26074b 0%, #120325 36%, #05010c 100%);
      }

      a {
        color: inherit;
      }

      .page {
        width: min(calc(100% - 32px), var(--max-width));
        margin: 0 auto;
        padding: 24px 0 40px;
      }

      .card {
        border: 1px solid var(--border);
        background: linear-gradient(180deg, var(--panel-strong), var(--panel));
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 28px;
        border-radius: var(--radius-xl);
      }

      .hero-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-logo {
        width: 58px;
        height: 58px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .brand-copy strong {
        display: block;
        font-size: 18px;
      }

      .brand-copy span {
        display: block;
        color: var(--text-muted);
        font-size: 13px;
      }

      .lang-switch,
      .doc-switch {
        display: inline-flex;
        gap: 8px;
        padding: 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        background: transparent;
        color: var(--text-muted);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      button.is-active {
        color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(142, 76, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .badge-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fff;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(32px, 6vw, 54px);
        line-height: 1.02;
        letter-spacing: -0.05em;
        max-width: 780px;
      }

      .hero-summary {
        max-width: 760px;
        margin: 0;
        color: var(--text-soft);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .chip {
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        font-size: 13px;
      }

      .doc-selector {
        margin-top: 18px;
        padding: 10px;
        border-radius: var(--radius-lg);
      }

      .layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 18px;
        margin-top: 18px;
      }

      .sidebar,
      .content-wrap,
      .footer {
        border-radius: var(--radius-lg);
      }

      .sidebar {
        position: sticky;
        top: 24px;
        align-self: start;
        padding: 20px;
      }

      .sidebar h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .sidebar p {
        margin: 0 0 14px;
        color: var(--text-soft);
        font-size: 14px;
      }

      .toc {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .toc a {
        text-decoration: none;
        color: var(--text-soft);
        padding: 10px 12px;
        border-radius: 12px;
      }

      .toc a.is-active,
      .toc a:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }

      .content-wrap {
        padding: 18px;
      }

      .section {
        padding: 18px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
      }

      .section + .section {
        margin-top: 14px;
      }

      .section-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .section-number {
        min-width: 36px;
        height: 36px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: rgba(142, 76, 255, 0.18);
        color: #fff;
        font-weight: 800;
      }

      .section-title {
        margin: 0;
        font-size: 22px;
      }

      .line {
        margin: 10px 0 0;
        color: var(--text-soft);
      }

      .line.subhead {
        color: #fff;
        font-weight: 700;
      }

      .line-list {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      .line-item {
        display: grid;
        grid-template-columns: 10px 1fr;
        gap: 10px;
        color: var(--text-soft);
      }

      .line-item::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 8px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      }

      .notice {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: #f0e7ff;
      }

      .footer {
        margin-top: 18px;
        padding: 18px 20px;
        color: var(--text-soft);
      }

      @media (max-width: 920px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }
      }

      @media (max-width: 640px) {
        .page {
          width: min(calc(100% - 20px), var(--max-width));
          padding-top: 14px;
        }

        .hero,
        .content-wrap,
        .sidebar,
        .footer {
          padding-left: 16px;
          padding-right: 16px;
        }

        .doc-switch {
          width: 100%;
          flex-wrap: wrap;
        }

        .doc-switch button {
          width: 100%;
        }
      }
    </style>
  </head>

      const brandTagline = document.getElementById("brandTagline");
      const badgeLabel = document.getElementById("badgeLabel");
      const heroTitle = document.getElementById("heroTitle");
      const heroSummary = document.getElementById("heroSummary");
      const updatedAt = document.getElementById("updatedAt");
      const languageMeta = document.getElementById("languageMeta");
      const formatMeta = document.getElementById("formatMeta");
      const sidebarTitle = document.getElementById("sidebarTitle");
      const sidebarNote = document.getElementById("sidebarNote");
      const footerText = document.getElementById("footerText");
      const toc = document.getElementById("toc");
      const content = document.getElementById("content");
      const termsSwitchTitle = document.getElementById("termsSwitchTitle");
      const privacySwitchTitle = document.getElementById("privacySwitchTitle");
      const docButtons = Array.from(document.querySelectorAll(".switch-btn"));
      const langButtons = Array.from(document.querySelectorAll(".lang-btn"));

      let activeLocale = "ru";
      let activeDoc = "terms";
      let observer;

      function slugify(text) {
        return text.toLowerCase().replace(/[^a-zа-я0-9]+/gi, "-").replace(/^-+|-+$/g, "");
      }

      function linkifyEmails(text) {
        return text.replace(
          /([A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})/gi,
          '<a href="mailto:$1">$1</a>'
        );
      }

      function applyUiLocale() {
        const localeUi = ui[activeLocale];
        document.documentElement.lang = activeLocale;
        brandTagline.textContent = localeUi.brandTagline;
        languageMeta.textContent = localeUi.languageMeta;
        formatMeta.textContent = localeUi.formatMeta;
        sidebarTitle.textContent = localeUi.sidebarTitle;
        sidebarNote.textContent = localeUi.sidebarNote;
        termsSwitchTitle.textContent = localeUi.termsSwitchTitle;
        privacySwitchTitle.textContent = localeUi.privacySwitchTitle;

        langButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.locale === activeLocale);
        });
      }

      function renderDocument() {
        applyUiLocale();
        const doc = documents[activeLocale][activeDoc];

        badgeLabel.textContent = doc.badge;
        heroTitle.textContent = doc.title;
        heroSummary.textContent = doc.summary;
        updatedAt.textContent = doc.updatedAtLabel;
        footerText.textContent = doc.footer;

        docButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.doc === activeDoc);
        });

        toc.innerHTML = "";
        content.innerHTML = "";

        doc.sections.forEach((section) => {
          const id = `${activeLocale}-${activeDoc}-${section.number}-${slugify(section.title)}`;

          const link = document.createElement("a");
          link.href = `#${id}`;
          link.textContent = `${section.number}. ${section.title}`;
          toc.appendChild(link);

          const card = document.createElement("article");
          card.className = "section";
          card.id = id;

          const head = document.createElement("div");
          head.className = "section-head";
          head.innerHTML = `<div class="section-number">${section.number}</div><h2 class="section-title">${section.title}</h2>`;
          card.appendChild(head);

          let listContainer = null;

          section.lines.forEach((line) => {
            if (line.startsWith("- ")) {
              if (!listContainer) {
                listContainer = document.createElement("div");
                listContainer.className = "line-list";
                card.appendChild(listContainer);
              }

              const item = document.createElement("div");
              item.className = "line-item";
              item.innerHTML = `<div>${linkifyEmails(line.slice(2))}</div>`;
              listContainer.appendChild(item);
              return;
            }

            listContainer = null;
            const paragraph = document.createElement("p");
            paragraph.className = `line${/^\d+\.\d+\./.test(line) ? " subhead" : ""}`;
            paragraph.innerHTML = linkifyEmails(line);
            card.appendChild(paragraph);
          });

          if (section.notice) {
            const notice = document.createElement("div");
            notice.className = "notice";
            notice.textContent = section.notice;
            card.appendChild(notice);
          }

          content.appendChild(card);
        });

        bindObserver();
      }

      function bindObserver() {
        if (observer) {
          observer.disconnect();
        }

        const links = Array.from(toc.querySelectorAll("a"));
        const sections = Array.from(content.querySelectorAll(".section"));

        observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) {
                return;
              }

              const id = entry.target.id;
              links.forEach((link) => {
                link.classList.toggle("is-active", link.getAttribute("href") === `#${id}`);
              });
            });
          },
          { rootMargin: "-25% 0px -60% 0px", threshold: 0.1 }
        );

        sections.forEach((section) => observer.observe(section));
      }

      docButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeDoc = button.dataset.doc;
          renderDocument();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      langButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeLocale = button.dataset.locale;
          renderDocument();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      renderDocument();
    </script>
  </body>
