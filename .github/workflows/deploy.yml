name: infra-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync_repo:
    runs-on: ubuntu-latest

    steps:
      - name: Sync infra repository on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/fibe
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main
