services:
  backend:
    image: ${BACKEND_IMAGE}
    pull_policy: build
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MODE: ${MODE:-PROD}
      PORT: ${PORT:-3001}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_AUTH_ACTION_URL: ${APP_AUTH_ACTION_URL}
    networks:
      - edge
      - internal

  admin:
    image: ${ADMIN_IMAGE}
    pull_policy: build
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_API: ${VITE_API_BASE_URL:-https://api.fibe.pro}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    networks:
      - edge

  landing:
    image: ${LANDING_IMAGE:-ghcr.io/akbarbiinazar/fibe-landing:latest}
    pull_policy: build
    build:
      context: ../fibe-landing
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - edge
      - internal

  organizer-cabinet:
    image: ${ORGANIZER_CABINET_IMAGE:-ghcr.io/fibe-pro/fibe-organizer-cabinet:latest}
    pull_policy: build
    build:
      context: ../organizer-cabinet
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.fibe.pro}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    networks:
      - edge

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.fibe.pro}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      CABINET_DOMAIN: ${CABINET_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - landing
      - admin
      - organizer-cabinet
      - backend
    networks:
      - edge

networks:
  edge:
  internal:

volumes:
  caddy_data:
  caddy_config:
